name: اختبار الأصول
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: بناء كل أصل بكل جودة وفحصه
        run: node tests/run-tests.js
