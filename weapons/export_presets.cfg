; The weapon lab for the browser (demo/lab/weapon_lab.tscn): single-threaded (no
; cross-origin isolation headers needed, so it runs from GitHub Pages), no PWA,
; Compatibility renderer. The custom feature "blaster_lab" makes the lab the main scene
; (project.godot run/main_scene.blaster_lab); desktop runs keep the blaster demo.
; Export: godot --headless --path . --export-release "Web" build/web-lab/index.html
[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features="blaster_lab"
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, docs/*, build/*, addons/aboden_blaster/tools/*, addons/aboden_blaster/military/tools_bake_icons.gd, addons/aboden_blaster/military/icons/*.svg"
export_path="build/web-lab/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><style>html,body{background:#121626;touch-action:none;overscroll-behavior:none}#status{background:#121626!important}#status-progress{accent-color:#ffc857}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
