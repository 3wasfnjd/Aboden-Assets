<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="900" height="900"></canvas>
<script src="REPO/core/math.js"></script>
<script src="REPO/core/builder.js"></script>
<script src="REPO/core/tree.js"></script>
<script src="REPO/plants/palm.js"></script>
<script src="REPO/plants/trees.js"></script>
<script src="REPO/plants/shrubs.js"></script>
<script>
// Minimal raw-WebGL2 renderer for snapshots (no three.js): vertex colors, hemi + sun, PCF shadows, fog.
window.render = function (assetId, quality, over, cam) {
  const cv = document.getElementById('c');
  const W = cam.w || 900, H = cam.h || 900; cv.width = W; cv.height = H;
  const gl = cv.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
  const A = AA.assets[assetId];
  const p = AA.params(A, over || {});
  const out = A.generate(p, quality);

  // merge parts
  const pos = [], nor = [], col = [], idx = []; let base = 0;
  for (const k in out.parts) {
    const d = out.parts[k];
    for (let i = 0; i < d.positions.length; i++) { pos.push(d.positions[i]); nor.push(d.normals[i]); col.push(d.colors[i]); }
    for (let i = 0; i < d.indices.length; i++) idx.push(d.indices[i] + base);
    base += d.positions.length / 3;
  }
  // ground disk
  const G = 40, gr = Math.max(8, out.meta.radius * 4), gc = [0.86, 0.74, 0.55];
  const g0 = pos.length / 3;
  pos.push(0, 0, 0); nor.push(0, 1, 0); col.push(...gc);
  for (let i = 0; i < G; i++) { const a = i / G * 6.2832; pos.push(Math.cos(a) * gr, 0, Math.sin(a) * gr); nor.push(0, 1, 0); col.push(...gc); }
  for (let i = 0; i < G; i++) idx.push(g0, g0 + 1 + (i + 1) % G, g0 + 1 + i);

  let minY = 1e9, maxY = -1e9, maxR = 0, cx = 0, cz = 0, n = 0;
  for (let i = 0; i < g0 * 3; i += 3) { minY = Math.min(minY, pos[i + 1]); maxY = Math.max(maxY, pos[i + 1]); cx += pos[i]; cz += pos[i + 2]; n++; }
  cx /= n; cz /= n;
  for (let i = 0; i < g0 * 3; i += 3) maxR = Math.max(maxR, Math.hypot(pos[i] - cx, pos[i + 2] - cz));

  function buf(type, data) { const b = gl.createBuffer(); gl.bindBuffer(type, b); gl.bufferData(type, data, gl.STATIC_DRAW); return b; }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const attr = (loc, data) => { buf(gl.ARRAY_BUFFER, new Float32Array(data)); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0); };
  attr(0, pos); attr(1, nor); attr(2, col);
  buf(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx));

  function sh(src, t) { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(vs, gl.VERTEX_SHADER)); gl.attachShader(p, sh(fs, gl.FRAGMENT_SHADER));
    gl.bindAttribLocation(p, 0, 'aP'); gl.bindAttribLocation(p, 1, 'aN'); gl.bindAttribLocation(p, 2, 'aC'); gl.linkProgram(p); return p; }

  const depthP = prog(`#version 300 es
in vec3 aP; uniform mat4 uL; void main(){ gl_Position = uL*vec4(aP,1.0); }`,
  `#version 300 es
precision highp float; void main(){}`);
  const mainP = prog(`#version 300 es
in vec3 aP; in vec3 aN; in vec3 aC; uniform mat4 uVP; uniform mat4 uL;
out vec3 vN; out vec3 vC; out vec4 vL; out vec3 vW;
void main(){ vN=aN; vC=pow(aC,vec3(2.2)); vL=uL*vec4(aP,1.0); vW=aP; gl_Position=uVP*vec4(aP,1.0);}`,
  `#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vN; in vec3 vC; in vec4 vL; in vec3 vW; uniform sampler2DShadow uS; uniform vec3 uSun; uniform vec3 uEye;
out vec4 o;
void main(){
  vec3 n = normalize(vN); if(!gl_FrontFacing) n=-n;
  vec3 l = vL.xyz/vL.w*0.5+0.5; float sh=0.0; vec2 ts=vec2(1.0/2048.0);
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++) sh+=texture(uS, vec3(l.xy+vec2(x,y)*ts, l.z-0.0015));
  sh/=9.0;
  float d = max(dot(n,uSun),0.0);
  vec3 hemi = mix(vec3(0.62,0.52,0.40), vec3(0.62,0.72,0.85), n.y*0.5+0.5);
  vec3 c = vC*(hemi*0.62 + vec3(1.0,0.93,0.80)*d*sh*1.35);
  c = (c*(2.51*c+0.03))/(c*(2.43*c+0.59)+0.14);
  float f = smoothstep(30.0, 90.0, length(vW-uEye));
  c = mix(c, vec3(0.80,0.74,0.64), f*0.0);
  o = vec4(pow(clamp(c,0.0,1.0),vec3(1.0/2.2)),1.0);
}`);

  // math
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], nrm = a => { const l = Math.hypot(...a); return a.map(x => x / l); };
  const crs = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  function lookAt(e, t) { const z = nrm(sub(e, t)), x = nrm(crs([0, 1, 0], z)), y = crs(z, x);
    return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1]; }
  function persp(f, a, n, fa) { const t = 1 / Math.tan(f / 2); return [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, 2 * fa * n / (n - fa), 0]; }
  function ortho(l, r, b, t, n, f) { return [2 / (r - l), 0, 0, 0, 0, 2 / (t - b), 0, 0, 0, 0, -2 / (f - n), 0, -(r + l) / (r - l), -(t + b) / (t - b), -(f + n) / (f - n), 1]; }
  function mul(a, b) { const o = new Array(16).fill(0); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) for (let k = 0; k < 4; k++) o[j * 4 + i] += a[k * 4 + i] * b[j * 4 + k]; return o; }

  const sun = nrm([0.55, 0.9, 0.35]);
  const ext = Math.max(maxY, maxR) * 1.3 + 2;
  const tgt = [cx, (minY + maxY) * 0.5, cz];
  const L = mul(ortho(-ext, ext, -ext, ext, 0.1, ext * 4), lookAt([tgt[0] + sun[0] * ext * 2, tgt[1] + sun[1] * ext * 2, tgt[2] + sun[2] * ext * 2], tgt));

  // shadow map
  const st = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, st);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT32F, 2048, 2048);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, st, 0);
  gl.viewport(0, 0, 2048, 2048); gl.enable(gl.DEPTH_TEST); gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(depthP); gl.uniformMatrix4fv(gl.getUniformLocation(depthP, 'uL'), false, L);
  gl.drawElements(gl.TRIANGLES, idx.length - G * 3, gl.UNSIGNED_INT, 0);

  // main
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
  gl.clearColor(0.72, 0.82, 0.90, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const az = cam.az || 0.7, el = cam.el == null ? 0.18 : cam.el;
  const size = Math.max(maxY - minY, maxR * 2);
  const dist = (cam.dist || 1) * size / (2 * Math.tan(0.35)) * 1.05 + 0.3;
  const t2 = [tgt[0], tgt[1] + (cam.dy || 0), tgt[2]];
  const eye = [t2[0] + Math.cos(az) * Math.cos(el) * dist, t2[1] + Math.sin(el) * dist, t2[2] + Math.sin(az) * Math.cos(el) * dist];
  const VP = mul(persp(0.7, W / H, 0.05, 400), lookAt(eye, t2));
  gl.useProgram(mainP);
  gl.uniformMatrix4fv(gl.getUniformLocation(mainP, 'uVP'), false, VP);
  gl.uniformMatrix4fv(gl.getUniformLocation(mainP, 'uL'), false, L);
  gl.uniform3fv(gl.getUniformLocation(mainP, 'uSun'), sun); gl.uniform3fv(gl.getUniformLocation(mainP, 'uEye'), eye);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, st); gl.uniform1i(gl.getUniformLocation(mainP, 'uS'), 0);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);
  return { tris: out.triangles, h: maxY, r: maxR };
};
</script>
